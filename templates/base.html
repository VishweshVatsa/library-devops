<!doctype html>
<html><head><meta charset="utf-8"><title>Library Management</title>
<style>
 body{font-family:system-ui,sans-serif;max-width:900px;margin:2rem auto;padding:0 1rem;color:#222}
 nav a{margin-right:1rem;font-weight:600;text-decoration:none;color:#1a56db}
 table{width:100%;border-collapse:collapse;margin:1rem 0}
 th,td{border-bottom:1px solid #ddd;padding:.5rem;text-align:left}
 input,select,button{padding:.4rem;margin-right:.4rem}
 .flash{background:#fde8e8;padding:.6rem;border-radius:4px}
</style></head><body>
<h1>Library Management System</h1>
<nav><a href="/">Books</a><a href="/members">Members</a><a href="/issues">Issue / Return</a></nav><hr>
{% for m in get_flashed_messages() %}<p class="flash">{{ m }}</p>{% endfor %}
{% block content %}{% endblock %}
</body></html>
