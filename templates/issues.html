{% extends "base.html" %}{% block content %}
<h2>Issue a book</h2>
<form method="post">
 <select name="book_id">{% for b in books %}<option value="{{ b.id }}">{{ b.title }} ({{ b.copies }} left)</option>{% endfor %}</select>
 <select name="member_id">{% for m in members %}<option value="{{ m.id }}">{{ m.name }}</option>{% endfor %}</select>
 <button>Issue</button>
</form>
<h2>History</h2>
<table><tr><th>Book</th><th>Member</th><th>Issued</th><th>Returned</th></tr>
{% for i in issues %}<tr><td>{{ i.book.title }}</td><td>{{ i.member.name }}</td><td>{{ i.issue_date }}</td>
<td>{% if i.return_date %}{{ i.return_date }}{% else %}
<form method="post" action="/issues/{{ i.id }}/return"><button>Return</button></form>{% endif %}</td></tr>
{% endfor %}</table>{% endblock %}
