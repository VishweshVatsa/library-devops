services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
      POSTGRES_DB: library
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library"]
      interval: 5s
      retries: 10

  web:
    build: .
    ports:
      - "5000:5000"
    environment:
            DATABASE_URL: postgresql+psycopg2://library:library@db:5432/library
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
